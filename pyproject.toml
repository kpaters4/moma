[project]
name = "moma-eda"
version = "0.1.0"
description = "Streamlit EDA app for the MoMA art collection dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg[binary]>=3.2",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "modal>=1.0.0",
]

[tool.uv]
package = false
